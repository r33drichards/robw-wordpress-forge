name: Forge development gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  wordpress-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python3 tools/setup-oauth.py
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx playwright install chromium
      - run: npm test
        env:
          TEST_PHP: ${{ matrix.php }}
      - run: python3 tools/package.py

  official-wordpress-plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e
        with:
          build-dir: robw-forge
          strict: true
